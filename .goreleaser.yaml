# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: orbit

before:
  hooks:
    - go mod tidy

builds:
  - id: orbit
    main: ./cmd/orbit
    binary: orbit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Dendro-X0/Orbit/internal/cli.Version={{.Version}}
      - -X github.com/Dendro-X0/Orbit/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/Dendro-X0/Orbit/internal/cli.BuildDate={{.Date}}

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Dendro-X0
    name: Orbit
  draft: false
  prerelease: auto
  name_template: "Orbit {{.Tag}}"
