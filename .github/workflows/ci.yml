name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go mod download
      - name: Build and smoke test
        run: |
          make build
          VERSION=$(grep -E '^VERSION \?=' Makefile | awk '{print $3}')
          ./orbit version | grep -q "orbit ${VERSION}"
      - run: go test ./...
      - run: go vet ./...
